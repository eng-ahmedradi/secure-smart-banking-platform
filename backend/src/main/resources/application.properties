spring.application.name=securebank-api
server.port=8080

# PostgreSQL connection (override via env vars for production)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/securebank}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT - CHANGE THIS SECRET before deploying anywhere real
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=3600000

# Allowed origin for the static frontend (Live Server / file server). Adjust as needed.
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://127.0.0.1:5501
