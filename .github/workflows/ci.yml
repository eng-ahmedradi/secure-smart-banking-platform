name: CI

on:
  push:
    branches:
      - devops
  pull_request:
    branches:
      - devops

jobs:
  backend:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build and Test Backend
        working-directory: backend
        run: mvn -B test package

  frontend:
    name: Frontend Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Frontend Image
        run: docker build -t secure-banking-frontend:ci ./securebank-app

  backend-docker:
    name: Backend Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: docker build -t secure-banking-backend:ci ./backend
